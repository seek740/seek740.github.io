baseURL = "https://seek740.github.io/"
title = "seek740's Blog"
locale = "zh-cn"
paginate = 8
theme = "PaperMod"

enableRobotsTXT = true
buildDrafts = false
buildFuture = false

# 语法高亮
[markup]
  [markup.highlight]
    noClasses = false

# 菜单
[[menu.main]]
  identifier = "posts"
  name = "文章"
  url = "/posts/"
  weight = 10

[[menu.main]]
  identifier = "tags"
  name = "标签"
  url = "/tags/"
  weight = 20

[[menu.main]]
  identifier = "archives"
  name = "归档"
  url = "/archives/"
  weight = 30

[[menu.main]]
  identifier = "search"
  name = "搜索"
  url = "/search/"
  weight = 40

# 参数
[params]
  env = "production"
  description = "技术博客 - 记录学习与实践"
  keywords = ["blog", "tech", "开发", "教程"]
  author = "seek740"
  DateFormat = "2006-01-02"
  defaultTheme = "auto"
  disableThemeToggle = false

  comments = true
  ShowReadingTime = true
  ShowShareButtons = true
  ShowPostNavLinks = true
  ShowBreadCrumbs = true
  ShowCodeCopyButtons = true
  ShowWordCount = true
  ShowRssButtonInSectionTermList = false
  UseHugoToc = true

  # 首页个人卡片
  [params.profileMode]
    enabled = true
    title = "seek740"
    subtitle = "全栈开发者 · 技术爱好者\n记录学习与实践，分享开发经验"
    imageUrl = "/images/avatar.png"
    imageWidth = 120
    imageHeight = 120

    [[params.profileMode.buttons]]
      name = "文章"
      url = "/posts/"

    [[params.profileMode.buttons]]
      name = "标签"
      url = "/tags/"

    [[params.profileMode.buttons]]
      name = "归档"
      url = "/archives/"

    [[params.profileMode.buttons]]
      name = "GitHub"
      url = "https://github.com/seek740"

  [params.homeInfoParams]
    Title = ""
    Content = ""

  # 社交图标
  [[params.socialIcons]]
    name = "github"
    url = "https://github.com/seek740"

  # Giscus 评论系统 - 去 https://giscus.app 获取你的 repo-id 和 category-id
  [params.giscus]
    repo = "seek740/seek740.github.io"
    repoId = "R_kgDOSs79kg"
    category = "General"
    categoryId = "DIC_kwDOSs79ks4C-NV_"
    mapping = "pathname"
    lang = "zh-CN"

  # 搜索 (使用 Fuse.js)
  [params.fuseOpts]
    isCaseSensitive = false
    shouldSort = true
    location = 0
    distance = 1000
    threshold = 0.4
    minMatchCharLength = 0
    keys = ["title", "permalink", "summary", "content"]
